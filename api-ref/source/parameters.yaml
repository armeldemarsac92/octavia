  in: body
  required: true
  type: array
l7policy-action:
  description: |
    The L7 policy action.  One of ``REDIRECT_PREFIX``, ``REDIRECT_TO_POOL``,
    ``REDIRECT_TO_URL``, or ``REJECT``. The regional capability
    ``http_request_redirect_v1`` adds ``REDIRECT_REQUEST``.
  in: body
  required: true
  type: string
l7policy-action-optional:
  description: |
    The L7 policy action.  One of ``REDIRECT_PREFIX``, ``REDIRECT_TO_POOL``,
    ``REDIRECT_TO_URL``, or ``REJECT``. The regional capability
    ``http_request_redirect_v1`` adds ``REDIRECT_REQUEST``.
  in: body
  required: false
  type: string
l7policy-id:
  description: |
    The ID of the L7 policy.
  in: body
  required: true
  type: uuid
l7policy-ids:
  description: |
    A list of L7 policy IDs.
  in: body
  required: true
  type: array
l7policy-position:
  description: |
    The position of this policy on the listener. Positions start at 1.
  in: body
  required: true
  type: integer
l7policy-position-optional:
  description: |
    The position of this policy on the listener. Positions start at 1.
  in: body
  required: false
  type: integer
l7policy-redirect-http-code:
  description: |
    Requests matching this policy will be redirected to the specified URL or
    Prefix URL with the HTTP response code. Valid if ``action`` is
    ``REDIRECT_TO_URL``, ``REDIRECT_PREFIX`` or ``REDIRECT_REQUEST``.
    Valid options are 301, 302, 303, 307 and 308. Default is 302.
  in: body
  min_version: 2.9
  required: true
  type: integer
l7policy-redirect-http-code-optional:
  description: |
    Requests matching this policy will be redirected to the specified URL or
    Prefix URL with the HTTP response code. Valid if ``action`` is
    ``REDIRECT_TO_URL``, ``REDIRECT_PREFIX`` or ``REDIRECT_REQUEST``.
    Valid options are 301, 302, 303, 307 and 308. Default is 302.
  in: body
  min_version: 2.9
  required: false
  type: integer
l7policy-redirect-pool_id:
  description: |
    Requests matching this policy will be redirected to the pool with this ID.
    Only valid if ``action`` is ``REDIRECT_TO_POOL``. The pool has some
    restrictions, See :ref:`valid_protocol`.
  in: body
  required: true
  type: uuid
l7policy-redirect-pool_id-optional:
  description: |
    Requests matching this policy will be redirected to the pool with this ID.
    Only valid if ``action`` is ``REDIRECT_TO_POOL``. The pool has some
    restrictions, See :ref:`valid_protocol`.
  in: body
  required: false
  type: uuid
l7policy-redirect-prefix:
  description: |
    Requests matching this policy will be redirected to this Prefix URL.
    Only valid if ``action`` is ``REDIRECT_PREFIX``.
  in: body
  required: true
  type: string
l7policy-redirect-prefix-optional:
  description: |
    Requests matching this policy will be redirected to this Prefix URL.
    Only valid if ``action`` is ``REDIRECT_PREFIX``.
  in: body
  required: false
  type: string
l7policy-redirect-request:
  description: |
    Structured redirect settings for ``REDIRECT_REQUEST``. Contains required
    ``scheme`` and ``port``, optional ``hostname``, and at most one path
    modifier, ``replace_full_path`` or ``replace_prefix``. Other actions omit
    this field.
  in: body
  required: false
  type: object
l7policy-redirect-url:
  description: |
    Requests matching this policy will be redirected to this URL.
    Only valid if ``action`` is ``REDIRECT_TO_URL``.
  in: body
  required: true
  type: string
l7policy-http-request-policy:
  description: |
    Deadlines and retries for the selected HTTP forwarding policy.
    The optional fields are ``request_timeout_ms``,
    ``backend_request_timeout_ms`` and ``retry``. With the
    ``http_retry_backoff_v1`` capability, ``retry`` also accepts
    ``backoff_ms``. Omit the policy field in an
    update to preserve it or send ``null`` to clear it. Responses omit
    the field when it has no stored value.
  in: body
  required: false
  type: object
l7policy-request-mirrors:
  description: |
    Ordered HTTP request copies sent by the selected L7 policy. Each entry
    requires an HTTP pool UUID and an integer sampling ratio represented
    by ``numerator`` and ``denominator``. Omit the field in a policy update
    to preserve the list, or send ``null`` or an empty list to clear it.
    Responses return an empty list when there are no policy-level mirrors.
  in: body
  required: false
  type: array
l7policy-request-cors:
  description: |
    CORS settings for the selected ``REDIRECT_TO_POOL`` or
    ``WEIGHTED_TARGETS`` policy on an HTTP or terminated HTTPS listener.
    The optional keys are ``allow_origins``, ``allow_credentials``,
    ``allow_methods``, ``allow_headers``, ``expose_headers`` and
    ``max_age``. An empty object applies CORS with no allowed origins.
    Omit the field in an update to preserve it, or send ``null`` to clear
    it. Responses omit the field when it has no stored value.
  in: body
  required: false
  type: object
l7policy-request-url-rewrite:
  description: |
    Request URL changes made by the winning HTTP forwarding policy.
    Requires a DNS ``hostname``, a ``replace_full_path`` string or a
    ``replace_prefix`` object with ``match`` and ``replacement``. A
    hostname and one path modifier can be combined. Send ``null`` in an
    update to clear the settings. Responses omit the field when unset.
  in: body
  required: false
  type: object
l7policy-redirect-url-optional:
  description: |
    Requests matching this policy will be redirected to this URL.
    Only valid if ``action`` is ``REDIRECT_TO_URL``.
  in: body
  required: false
  type: string
l7policy-initial-rules:
  description: |
    When the provider advertises ``l7policy_initial_rules_v1``, a non-empty
    array of initial L7 rules for a policy created with ``admin_state_up: false``.
    Each rule accepts ``type``, ``compare_type``, ``value``, and optionally
    ``key``, ``invert``, ``admin_state_up``, and ``tags``.
  in: body
  required: false
  type: array
l7policy-rule-ids:
  description: |
    List of associated L7 rule IDs.
  in: body
  required: true
  type: array
l7rule-compare_type:
  description: |
    The comparison type for the L7 rule. One of ``CONTAINS``, ``ENDS_WITH``,
    ``EQUAL_TO``, ``REGEX``, or ``STARTS_WITH``.
  in: body
  required: true
  type: string
l7rule-compare_type-optional:
  description: |
    The comparison type for the L7 rule. One of ``CONTAINS``, ``ENDS_WITH``,
    ``EQUAL_TO``, ``REGEX``, or ``STARTS_WITH``.
  in: body
  required: false
  type: string
l7rule-id:
  description: |
    The ID of the L7 rule.
  in: body
  required: true
  type: uuid
l7rule-invert:
  description: |
    When ``true`` the logic of the rule is inverted. For example, with
    invert ``true``, `equal to` would become `not equal to`.
  in: body
  required: true
  type: boolean
l7rule-invert-optional:
  description: |
    When ``true`` the logic of the rule is inverted. For example, with
    invert ``true``, `equal to` would become `not equal to`.
    Default is ``false``.
  in: body
  required: false
  type: boolean
l7rule-key:
  description: |
    The key to use for the comparison. For example, the name of the cookie
    to evaluate.
  in: body
  required: true
  type: string
l7rule-key-optional:
  description: |
    The key to use for the comparison. For example, the name of the cookie
    to evaluate.
  in: body
  required: false
  type: string
l7rule-type:
  description: |
    The L7 rule type.  One of ``COOKIE``, ``FILE_TYPE``, ``HEADER``,
    ``HOST_NAME``, ``PATH``, ``SSL_CONN_HAS_CERT``, ``SSL_VERIFY_RESULT``,
    or ``SSL_DN_FIELD``. The Amphora provider additionally accepts ``TLS_SNI``
    for TCP passthrough, ``HTTP_HEADER_EXACT`` for full HTTP header
    values, and ``HTTP_METHOD`` for exact HTTP methods when enabled by the
    region. ``HTTP_QUERY_PARAM_EXACT`` requires the regional provider
    capability ``http_query_param_exact_v1`` for exact query parameter matches.
    ``GRPC_CONTENT_TYPE`` requires ``grpc_content_type_v1`` for native gRPC
    media type matching.
  in: body
  required: true
  type: string
l7rule-type-optional:
  description: |
    The L7 rule type.  One of ``COOKIE``, ``FILE_TYPE``, ``HEADER``,
    ``HOST_NAME``, ``PATH``, ``SSL_CONN_HAS_CERT``, ``SSL_VERIFY_RESULT``,
    or ``SSL_DN_FIELD``. The Amphora provider additionally accepts ``TLS_SNI``
    for TCP passthrough, ``HTTP_HEADER_EXACT`` for full HTTP header
    values, and ``HTTP_METHOD`` for exact HTTP methods when enabled by the
    region. ``HTTP_QUERY_PARAM_EXACT`` requires the regional provider
    capability ``http_query_param_exact_v1`` for exact query parameter matches.
    ``GRPC_CONTENT_TYPE`` requires ``grpc_content_type_v1`` for native gRPC
    media type matching.
  in: body
  required: false
  type: string
l7rule-value:
  description: |
