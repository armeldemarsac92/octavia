    ``null``.
  in: body
  required: false
  type: object
session_persistence_cookie:
  description: |
    The cookie name is required for ``APP_COOKIE``. On HTTP pools with a
    provider advertising ``http_cookie_name_v1``, it can also name the cookie
    generated for ``HTTP_COOKIE``. When there is no stored absolute timeout,
    omit the name or set it to ``null`` in a supplied ``HTTP_COOKIE`` object
    to use the provider's default name.
  in: body
  required: false
  type: string
session_persistence_cookie_path:
  description: |
    The Path attribute of the cookie generated for ``HTTP_COOKIE``.
    Custom values on HTTP pools require ``http_cookie_path_v1``.
    Accepts up to 1024 printable ASCII characters excluding semicolon
    and preserves the supplied string, including an empty string.
    Use ``null`` or ``/`` to select the default root path.
  in: body
  required: false
  type: string
session_persistence_cookie_absolute_timeout_ms:
  description: |
    The absolute age, in milliseconds, of an affinity cookie issued for a
    named ``HTTP_COOKIE`` HTTP pool. Accepts an integer from 0 through
    1439985600000 inclusive. A value of 0 expires immediately. Requires
    ``http_cookie_absolute_timeout_v1`` and ``cookie_scope``.
  in: body
  required: false
  type: integer
session_persistence_cookie_scope:
  description: |
    The logical scope of the absolute affinity cookie, as 64 lowercase
    hexadecimal characters. Use the same scope on pools in the same project
    that serve the same logical backend and share the cookie name and timeout.
    Supply or clear this field with ``cookie_absolute_timeout_ms``.
  in: body
  required: false
  type: string
session_persistence_cookie_permanent:
  description: |
    Set to ``true`` to give the named HTTP affinity cookie a browser
    ``Max-Age`` derived from its absolute timeout. Requires
    ``http_cookie_permanent_v1``, an absolute timeout and its scope.
    Set to ``false`` to use a browser session cookie.
  in: body
  required: false
  type: boolean
session_persistence_granularity:
  description: |
    The netmask used to determine SCTP or UDP session persistence. Currently
    only valid for SCTP or UDP pools with session persistence of SOURCE_IP.
    Default netmask is 255.255.255.255, meaning per client full IP.
  in: body
  min_version: 2.2
  required: false
  type: string
session_persistence_timeout:
  description: |
    The timeout, in seconds, after which a SCTP or UDP flow may be rescheduled
    to a different member. Currently only applies to SCTP or UDP pools with
    session persistence of SOURCE_IP. Default is 360.
  in: body
  min_version: 2.2
  required: false
  type: integer
session_persistence_type:
  description: |
    Session persistence type for the pool.  One of ``APP_COOKIE``,
    ``HTTP_COOKIE``, or ``SOURCE_IP``.
  in: body
  required: true
  type: string
sni_container_refs:
  description: |
    A list of URIs to the `key manager service
    <https://docs.openstack.org/barbican/latest/>`__ secrets containing
    PKCS12 format certificate/key bundles for ``TERMINATED_HTTPS`` listeners.
    (DEPRECATED) Secret containers of type "certificate" containing the
    certificates and keys for ``TERMINATED_HTTPS`` listeners.
  in: body
  required: true
  type: array
sni_container_refs-optional:
  description: |
