tcp_tls_mixed_mode:
  description: |
    Set to true on creation of a listener with ``tcp_tls_termination: true``
    to allow terminating and passthrough TLS SNI policies on the same port.
    Requires ``tcp_tls_mixed_mode_v1`` and a listener without a default pool.
    This field is immutable and is returned when enabled.
  in: body
  required: false
  type: boolean
tcp_tls_passthrough:
  description: |
    Set to true on creation of a redirect-to-pool policy on a mixed TLS
    listener to forward the original TLS stream to a TCP pool with
    ``tls_enabled: false``. Omit this field to use listener TLS termination.
    This field is immutable. Responses for a mixed TLS listener's policies
    return true for passthrough and false for listener TLS termination.
  in: body
  required: false
  type: boolean
tcp_tls_termination:
  description: |
    On creation, set this to true with protocol ``TCP`` and an authorized
    ``default_tls_container_ref`` to terminate client TLS and forward the
    decrypted stream to a plaintext TCP pool. The provider must advertise
    ``tcp_tls_termination_v1``. The listener mode is immutable. Octavia includes
    this field in listener responses when the mode is enabled.
  in: body
  required: false
  type: boolean
