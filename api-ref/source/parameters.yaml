    up (``true``) or down (``false``).
  in: body
  required: true
  type: boolean
admin_state_up-default-optional:
  description: |
    The administrative state of the resource, which is
    up (``true``) or down (``false``). Default is ``true``.
  in: body
  required: false
  type: boolean
admin_state_up-optional:
  description: |
    The administrative state of the resource, which is
    up (``true``) or down (``false``).
  in: body
  required: false
  type: boolean
allowed_cidrs:
  description: |
    A list of IPv4, IPv6 or mix of both CIDRs.
  in: body
  min_version: 2.12
  required: true
  type: array
allowed_cidrs-optional:
  description: |
    A list of IPv4, IPv6 or mix of both CIDRs. The default is all allowed.
    When a list of CIDRs is provided, the default switches to deny all.
  in: body
  min_version: 2.12
  required: false
  type: array
alpn_protocols-listener:
  description: |
    A list of ALPN protocols.
    Available protocols: http/1.0, http/1.1, h2
  in: body
  min_version: 2.20
  required: true
  type: array
alpn_protocols-listener-optional:
  description: |
    A list of ALPN protocols.
    Available protocols: http/1.0, http/1.1, h2
  in: body
  min_version: 2.20
  required: false
  type: array
alpn_protocols-pool:
  description: |
    A list of ALPN protocols.
    Available protocols: http/1.0, http/1.1, h2
  in: body
  min_version: 2.24
  required: true
  type: array
alpn_protocols-pool-optional:
  description: |
    A list of ALPN protocols.
    Available protocols: http/1.0, http/1.1, h2
  in: body
  min_version: 2.24
  required: false
  type: array
backend-h2c:
  description: |
    Whether cleartext HTTP pool members receive HTTP/2 with prior knowledge.
    Defaults to false. Enabling this setting requires the regional provider
    capability ``backend_h2c_v1`` and ``tls_enabled`` set to false.
    HTTP and HTTPS health monitors with an explicit HTTP/1.0 or HTTP/1.1
    version use that protocol for their probes, including on a separate port.
  in: body
  required: false
  type: boolean
backend-tls-hostname:
  description: |
    Literal DNS hostname sent as backend SNI. With no explicit
    ``backend_tls_subject_alt_names``, it also authenticates the backend
    certificate against its DNS subject alternative names. Requires
    ``tls_enabled`` set to true and either ``ca_tls_container_ref`` or
    ``backend_tls_system_ca``. HTTP pools use ``backend_tls_hostname_v1``.
    TCP pools use
    ``tcp_tls_backend_auth_v1`` and can only be attached to TCP listeners
    that terminate TLS. A partial update preserves the setting when omitted.
    To clear it, disable the pool, detach it from any terminating TCP
    listener defaults and policies, and explicitly send null while leaving
    the pool disabled.
  in: body
  required: false
  type: string
backend-tls-system-ca:
  description: |
    Use the regional Amphora system CA bundle to authenticate TLS pool
    members. Defaults to false. Requires ``backend_tls_system_ca_v1``,
    ``tls_enabled`` and ``backend_tls_hostname``. Omit
    ``ca_tls_container_ref`` and ``crl_container_ref``. Omission on update
    preserves the current value. Disable the pool before setting it to false.
  in: body
  required: false
  type: boolean
backend-tls-system-ca-sha256:
  description: |
    Read-only lowercase SHA-256 of the system CA PEM bundle prepared by
    all serving Amphorae for the active HAProxy configuration. An enabled
    and attached pool can report the digest before adding members.
    Returns null when the applied bundle is unconfirmed or the regional
    configuration has changed.
  in: body
  required: false
  type: string
backend-tls-require-h2:
  description: |
    Require the backend TLS peer to negotiate HTTP/2 through ALPN before
    sending application data. Defaults to false. Requires
    ``backend_tls_hostname`` and the regional provider capability
    ``backend_tls_h2_alpn_v1``. When true, the pool offers only ``h2``,
    regardless of its ``alpn_protocols`` setting. A partial update preserves
    the option when omitted. Disable the pool before setting it to false.
  in: body
  required: false
  type: boolean
tcp-connection-rejection:
  description: |
    The Amphora TCP pool's requested fraction of new connections to reject.
    The pool shows the desired fraction during provisioning and returns null
    when no fraction is configured.
  in: body
  required: false
  type: object
tcp-connection-rejection-request:
  description: |
    Set the TCP rejection fraction as part of a full member batch. The two
    required integers satisfy 0 <= reject_weight <= total_weight and
    1 <= total_weight <= 16000000. Zero disables rejection. Pass null to
    clear the fraction or omit the field to preserve it.
  in: body
  required: false
  type: object
udp-packet-drop:
  description: |
    The managed UDP pool's requested fraction of datagrams to drop.
    The pool exposes this value while provisioning. The field is absent
    for pools without a configured fraction.
  in: body
  required: false
  type: object
udp-packet-drop-request:
  description: |
    Set the Amphora UDP drop fraction with a full member batch.
    The two required integers satisfy 0 <= numerator <= denominator
    and 1 <= denominator <= 16000000. Use 0/1 to forward without
    proportional drops while keeping the listener managed.
  in: body
  required: false
  type: object
backend-retry-budget:
  description: |
    The Service retry budget for this HTTP pool. Provide the five fields
    documented under the ``backend_retry_budget_v1`` provider capability.
    Omission in an update keeps the previous settings. Set the field to null
    to remove the budget from this pool.
  in: body
  required: false
  type: object
backend-tls-subject-alt-names:
  description: |
    Up to five explicit backend TLS identities. Each entry is an object
    containing exactly ``type: Hostname`` and a ``hostname`` DNS name, or exactly
    ``type: URI`` and a ``uri`` absolute URI. A DNS name can start with a
    full-label wildcard (``*.``). A URI must be ASCII and preserves case and
    percent encoding. A non-empty list requires ``backend_tls_hostname``,
    ``tls_enabled: true``, ``ca_tls_container_ref``, and the regional provider
    capability ``backend_tls_subject_alt_names_v1``. The backend certificate
    must chain to the configured CA and match at least one typed SAN. The
    hostname continues to supply SNI independently of authentication.
    A partial update preserves the list when omitted. An empty list restores
    strict DNS authentication using ``backend_tls_hostname``.
  in: body
  required: false
  type: array
